apiVersion: apps/v1
kind: Deployment
metadata: { name: storefront, namespace: default }
spec:
  replicas: 2
  selector: { matchLabels: { app: storefront } }
  template:
    metadata: { labels: { app: storefront } }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 3 }
